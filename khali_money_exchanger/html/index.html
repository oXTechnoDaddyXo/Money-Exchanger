<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Gold Exchange</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

    <div class="box">

        <div class="title">
            GOLD EXCHANGE
        </div>

        <div
            class="welcome"
            id="welcome"
        >
        </div>

        <div
            class="description"
            id="description"
        >
        </div>

        <div class="ratebox">

            <div
                class="ratetitle"
                id="rateTitle"
            >
            </div>

            <div class="rate-line">

                <span class="gold-text">
                    1 GOLD
                </span>

                <span class="arrow">
                    ➜
                </span>

                <span
                    class="cash-text"
                    id="goldRate"
                >
                    0 CASH
                </span>

            </div>

            <div class="rate-line">

                <span class="cash-text">
                    1 CASH
                </span>

                <span class="arrow">
                    ➜
                </span>

                <span
                    class="gold-text"
                    id="cashRate"
                >
                    0 GOLD
                </span>

            </div>

        </div>

        <div class="stats">

            <div class="statbox">

                CASH

                <span id="cash">
                    0
                </span>

            </div>

            <div class="statbox">

                GOLD

                <span id="gold">
                    0
                </span>

            </div>

        </div>

        <input
            type="number"
            id="cashAmount"
            placeholder="Cash eingeben"
        >

        <button
            id="cashButton"
            type="button"
        >
            CASH → GOLD
        </button>

        <input
            type="number"
            id="goldAmount"
            placeholder="Gold eingeben"
        >

        <button
            id="goldButton"
            type="button"
        >
            GOLD → CASH
        </button>

        <button
            id="closeButton"
            class="close"
            type="button"
        >
            SCHLIESSEN
        </button>

    </div>

</div>

<div id="notify"></div>

<script src="script.js"></script>

</body>
</html>
